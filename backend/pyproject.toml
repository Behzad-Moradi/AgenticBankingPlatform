[project]
name = "backend"
version = "0.1.0"
description = "Backend for a production-style agentic AI banking platform"
readme = "README.md"
authors = [
    { name = "Behzad", email = "b.moradi@student.unimelb.edu.au" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]